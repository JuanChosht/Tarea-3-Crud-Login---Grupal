<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Crear cuenta')}"></head>
<body class="auth-bg d-flex flex-column min-vh-100">

<main class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-sm-10 col-md-7 col-lg-5">
            <div class="text-center text-white mb-4">
                <i class="bi bi-person-plus display-4"></i>
                <h1 class="h3 mt-2">Crear cuenta</h1>
            </div>

            <div class="card shadow">
                <div class="card-body p-4">
                    <form th:action="@{/registro}" th:object="${form}" method="post" novalidate>
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre completo</label>
                            <input type="text" th:field="*{nombre}" class="form-control"
                                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{nombre}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuario</label>
                            <input type="text" th:field="*{username}" class="form-control" autocomplete="username"
                                   th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{username}"></div>
                        </div>
                        <div class="row">
                            <div class="col-sm-6 mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" th:field="*{password}" class="form-control" autocomplete="new-password"
                                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{password}"></div>
                            </div>
                            <div class="col-sm-6 mb-4">
                                <label for="confirmarPassword" class="form-label">Confirmar</label>
                                <input type="password" th:field="*{confirmarPassword}" class="form-control" autocomplete="new-password"
                                       th:classappend="${#fields.hasErrors('confirmarPassword')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{confirmarPassword}"></div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-marca w-100">Registrarme</button>
                    </form>
                </div>
                <div class="card-footer bg-white text-center small py-3">
                    ¿Ya tienes cuenta? <a th:href="@{/login}" class="link-primary fw-semibold">Inicia sesión</a>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
