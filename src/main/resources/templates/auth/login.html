<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body class="auth-bg d-flex flex-column min-vh-100">

<main class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-sm-9 col-md-6 col-lg-4">
            <div class="text-center text-white mb-4">
                <i class="bi bi-shield-lock-fill display-4"></i>
                <h1 class="h3 mt-2">PagoSeguro</h1>
                <p class="mb-0 opacity-75">Pagos protegidos entre compradores y vendedores</p>
            </div>

            <div class="card shadow">
                <div class="card-body p-4">
                    <div th:if="${param.error}" class="alert alert-danger py-2">
                        <i class="bi bi-x-circle me-1"></i> Usuario o contraseña incorrectos.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-info py-2">
                        <i class="bi bi-door-closed me-1"></i> Cerraste sesión correctamente.
                    </div>
                    <div th:if="${exito}" class="alert alert-success py-2" th:text="${exito}"></div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuario</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" id="username" name="username" class="form-control"
                                       required autofocus autocomplete="username">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" id="password" name="password" class="form-control"
                                       required autocomplete="current-password">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-marca w-100">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar
                        </button>
                    </form>
                </div>
                <div class="card-footer bg-white text-center small py-3">
                    ¿No tienes cuenta? <a th:href="@{/registro}" class="link-primary fw-semibold">Regístrate</a>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
