<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${transaccion.id == null} ? 'Nueva transacción' : 'Editar transacción')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h1 class="h4 mb-0">
                        <i class="bi me-1 text-primary" th:classappend="${transaccion.id == null} ? 'bi-plus-circle' : 'bi-pencil-square'"></i>
                        <span th:text="${transaccion.id == null} ? 'Nueva transacción protegida' : 'Editar transacción ' + ${transaccion.codigo}">Transacción</span>
                    </h1>
                </div>
                <div class="card-body">
                    <div class="alert alert-primary small py-2" th:if="${transaccion.id == null}">
                        <i class="bi bi-shield-lock me-1"></i>
                        El comprador pagará el monto y el dinero quedará <strong>retenido</strong> hasta que confirme que recibió el producto.
                    </div>

                    <form th:action="@{/transacciones/guardar}" th:object="${transaccion}" method="post" novalidate>
                        <input type="hidden" th:field="*{id}">

                        <h2 class="h6 text-uppercase text-muted mt-2 mb-3">Producto</h2>
                        <div class="mb-3">
                            <label for="producto" class="form-label">Producto *</label>
                            <input type="text" th:field="*{producto}" class="form-control" placeholder="Ej: Bicicleta aro 29"
                                   th:classappend="${#fields.hasErrors('producto')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{producto}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción y condiciones</label>
                            <textarea th:field="*{descripcion}" rows="2" class="form-control" placeholder="Estado, accesorios, garantía…"
                                      th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid'"></textarea>
                            <div class="invalid-feedback" th:errors="*{descripcion}"></div>
                        </div>
                        <div class="row">
                            <div class="col-sm-6 mb-3">
                                <label for="monto" class="form-label">Monto a pagar *</label>
                                <div class="input-group has-validation">
                                    <span class="input-group-text">$</span>
                                    <input type="number" step="0.01" min="1" th:field="*{monto}" class="form-control"
                                           th:classappend="${#fields.hasErrors('monto')} ? 'is-invalid'">
                                    <div class="invalid-feedback" th:errors="*{monto}"></div>
                                </div>
                            </div>
                            <div class="col-sm-6 mb-3">
                                <label for="diasEntrega" class="form-label">Plazo de entrega *</label>
                                <div class="input-group has-validation">
                                    <input type="number" step="1" min="1" max="30" th:field="*{diasEntrega}" class="form-control"
                                           th:classappend="${#fields.hasErrors('diasEntrega')} ? 'is-invalid'">
                                    <span class="input-group-text">días</span>
                                    <div class="invalid-feedback" th:errors="*{diasEntrega}"></div>
                                </div>
                            </div>
                        </div>

                        <h2 class="h6 text-uppercase text-muted mt-2 mb-3">Partes</h2>
                        <div class="row">
                            <div class="col-sm-6 mb-3">
                                <label for="vendedor" class="form-label">Vendedor *</label>
                                <input type="text" th:field="*{vendedor}" class="form-control" placeholder="Nombre o tienda"
                                       th:classappend="${#fields.hasErrors('vendedor')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{vendedor}"></div>
                            </div>
                            <div class="col-sm-6 mb-3">
                                <label for="emailComprador" class="form-label">Correo del comprador *</label>
                                <input type="email" th:field="*{emailComprador}" class="form-control" placeholder="comprador@mail.com"
                                       th:classappend="${#fields.hasErrors('emailComprador')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{emailComprador}"></div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-2">
                            <a th:href="@{/transacciones}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-marca">
                                <i class="bi bi-save me-1"></i> Guardar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
